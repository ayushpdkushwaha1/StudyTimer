name: Build Android APK (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Directory Permissions for Docker
        run: |
          sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build APK using Official Docker Image
        uses: docker://kivy/buildozer:latest
        with:
          args: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTimer-APK
          path: bin/*.apk
